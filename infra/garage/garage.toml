# Configuração do Garage (armazenamento de arquivos compatível com S3) — D-31.
# Nó único (VPS própria). Os segredos NÃO ficam aqui: vêm das variáveis de ambiente
# GARAGE_RPC_SECRET e GARAGE_ADMIN_TOKEN.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
metadata_auto_snapshot_interval = "6h"

# Um único servidor: cada arquivo guardado uma vez (o backup é feito à parte).
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
