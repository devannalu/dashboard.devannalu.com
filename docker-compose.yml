# Serviços de desenvolvimento local (NÃO usar em produção).
# Subir: pnpm db:up   ·   Derrubar: pnpm db:down   ·   Dados persistem nos volumes nomeados.
#
# Armazenamento S3: Garage (D-31), o mesmo usado em produção na VPS.
name: annalu-studio-os

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: studio
      MYSQL_USER: studio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-studio_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"   # só na máquina local (3307 para não conflitar com outros projetos)
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev}"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Armazenamento de arquivos S3 (D-31). Inicialização única: ver docs/infra/armazenamento.md
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    environment:
      # Valores padrão SÓ para desenvolvimento local (porta presa em 127.0.0.1). Produção usa segredos próprios.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-6465762d6c6f63616c2d736f6d656e74652d6e616f2d757361722d656d2d70726f64}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-dev-local-admin-token}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"   # API S3 (só na máquina local)

volumes:
  mysql-data:
  garage-meta:
  garage-data:
