packages:
  - apps/*
  - packages/*

# Scripts de instalação de dependências: cada pacote precisa de decisão explícita (segurança da cadeia
# de suprimentos). false = bloqueado. Build, testes e migrações funcionam com todos estes bloqueados.
allowBuilds:
  sharp: false
  unrs-resolver: false
  esbuild: false
  prisma: false
  "@prisma/engines": false
